name: Run Single Test

on: 
    pull_request:
        branches: 
            - main
    workflow_dispatch:

jobs:
    single-test:
        runs-on: ubuntu-latest

        steps: 
            - name: Checkout repository
              uses: actions/checkout@v6

            - name: Set up Python
              uses: actions/setup-python@v7
              with:
                python-version: '3.12'
            
            - name: Install pytest
              run: python -m pip install pytest

            - name: Run selected test
              run: python -m pytest tests/test_coffee_maker.py::test_brew_latte